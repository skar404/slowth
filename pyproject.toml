[project]
name = "unscroll-surface-ml"
version = "0.1.0"
description = "Training and validation tools for the hierarchical on-device surface detector"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coremltools>=8.3,<10",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  # Core ML Tools 9.0 validates conversion against PyTorch 2.7.
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
