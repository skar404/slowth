name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/*slowth*'
      - 'scripts/render_privacy.py'
      - 'Localization/locales.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/*slowth*'
      - 'scripts/render_privacy.py'
      - 'Localization/locales.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify all localized pages
        run: |
          python3 scripts/render_slowth.py --check
          python3 scripts/check_slowth.py --app-locales Localization/locales.json
          python3 scripts/test_slowth_seo.py
      - name: Prepare public files
        run: |
          mkdir -p _site
          rsync -a --exclude='.*' --exclude='*.md' --exclude='localization/' --exclude='privacy-content.json' website/ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
