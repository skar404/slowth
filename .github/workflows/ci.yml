name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      readme_only: ${{ steps.classify.outputs.readme_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect root README-only PR
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          readme_only=false
          if [[ "$EVENT" == pull_request ]]; then
            changed="$RUNNER_TEMP/source-check-diff"
            git diff --name-status -z --no-renames "$BASE...$HEAD" > "$changed"
            if printf 'M\0README.md\0' | cmp -s - "$changed"; then
              readme_only=true
            fi
          fi
          echo "readme_only=$readme_only" >> "$GITHUB_OUTPUT"

  source:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Install verified build tools
        run: bash scripts/release_tools/install_tools.sh
      - name: Test durable pause policy
        run: |
          bash scripts/test_ios_blocking.sh
      - name: Test shared app runtime
        run: |
          swift test --scratch-path build/runtime-tests
          swift test --scratch-path build/runtime-tests -c release
      - name: Test release safety boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check public source, versions and WebExtension
        run: python3 scripts/release.py check

  webkit:
    needs: scope
    if: needs.scope.outputs.readme_only == 'false'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified build tools
        run: bash scripts/release_tools/install_tools.sh
      - name: Test web app profiles and WebKit lifecycle
        run: |
          test -f Configs/Local.xcconfig || cp Configs/Local.xcconfig.example Configs/Local.xcconfig
          bash scripts/test_web_apps.sh --simulator auto
      - name: Retain WebKit test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/webapps-tests/Logs/Test/
          if-no-files-found: warn
          retention-days: 7

  # Preserve the required "check" context; a skipped WebKit job is accepted
  # only when scope positively identified a root README-only pull request.
  check:
    if: ${{ always() }}
    needs: [scope, source, webkit]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          SCOPE: ${{ needs.scope.result }}
          SOURCE: ${{ needs.source.result }}
          WEBKIT: ${{ needs.webkit.result }}
          README_ONLY: ${{ needs.scope.outputs.readme_only }}
        run: |
          echo "scope=$SCOPE source=$SOURCE webkit=$WEBKIT readme_only=$README_ONLY"
          [[ "$SCOPE" == success && "$SOURCE" == success ]]
          case "$README_ONLY:$WEBKIT" in
            true:skipped|false:success) ;;
            *) exit 1 ;;
          esac
