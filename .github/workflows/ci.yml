name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      readme_only: ${{ steps.classify.outputs.readme_only }}
      website_only: ${{ steps.classify.outputs.website_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI scope classification
        run: python3 -m unittest discover -s tests -p 'test_ci_scope.py' -v
      - name: Detect website-only changes and README-only PRs
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_scope.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  website:
    needs: scope
    if: needs.scope.outputs.website_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify website generation, translations and SEO
        run: |
          python3 scripts/render_slowth.py --check
          python3 scripts/check_slowth.py --app-locales Localization/locales.json
          python3 scripts/test_slowth_seo.py

  source:
    needs: scope
    if: needs.scope.outputs.website_only == 'false'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Install verified build tools
        run: bash scripts/release_tools/install_tools.sh
      - name: Test durable pause policy
        run: |
          bash scripts/test_ios_blocking.sh
      - name: Test shared app runtime
        run: |
          swift test --scratch-path build/runtime-tests
          swift test --scratch-path build/runtime-tests -c release
      - name: Test release safety boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check public source, versions and WebExtension
        run: python3 scripts/release.py check

  webkit:
    needs: scope
    if: needs.scope.outputs.readme_only == 'false' && needs.scope.outputs.website_only == 'false'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified build tools
        run: bash scripts/release_tools/install_tools.sh
      - name: Test web app profiles and WebKit lifecycle
        run: |
          test -f Configs/Local.xcconfig || cp Configs/Local.xcconfig.example Configs/Local.xcconfig
          bash scripts/test_web_apps.sh --simulator auto
      - name: Retain WebKit test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/webapps-tests/Logs/Test/
          if-no-files-found: warn
          retention-days: 7

  # Preserve required "check": website-only changes need the website job;
  # all other changes retain app checks and the existing README exception.
  check:
    if: ${{ always() }}
    needs: [scope, source, webkit, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          SCOPE: ${{ needs.scope.result }}
          SOURCE: ${{ needs.source.result }}
          WEBKIT: ${{ needs.webkit.result }}
          README_ONLY: ${{ needs.scope.outputs.readme_only }}
          WEBSITE_ONLY: ${{ needs.scope.outputs.website_only }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          echo "scope=$SCOPE source=$SOURCE webkit=$WEBKIT website=$WEBSITE readme_only=$README_ONLY website_only=$WEBSITE_ONLY"
          [[ "$SCOPE" == success ]] || exit 1
          if [[ "$WEBSITE_ONLY" == true ]]; then
            [[ "$SOURCE" == skipped && "$WEBKIT" == skipped && "$WEBSITE" == success ]] || exit 1
          else
            [[ "$WEBSITE_ONLY" == false && "$SOURCE" == success && "$WEBSITE" == skipped ]] || exit 1
            case "$README_ONLY:$WEBKIT" in
              true:skipped|false:success) ;;
              *) exit 1 ;;
            esac
          fi
