      - path: data-model/exports/flat-13-seed7-20261027/ios-resources/FlatDetector13.mlpackage
        optional: true # Required in Release model assets.
      - path: data-model/exports/flat-12-seed7-20261027/ios-resources/FlatDetector12.mlpackage
        optional: true # Required in Release model assets.
      - path: data-model/exports/flat-11-seed7-iphone13promax-20261026/ios-resources/FlatDetectorIPhone13ProMax.mlpackage
