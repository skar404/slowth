name: Unscroll
options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  # Paths inside .xcscheme files (e.g. storeKitConfiguration) resolve relative to
  # xcshareddata/xcschemes/, which is 3 levels below the repo root, not 2 —
  # XcodeGen's own default ("../../") is one level short and left StoreKit
  # Configuration showing as an unresolved (red) reference in Xcode.
  schemePathPrefix: "../../../"

configFiles:
  Debug: Configs/Local.xcconfig
  Release: Configs/Local.xcconfig

# Loose files that should be visible in the project navigator but aren't part
# of any target's build phases. Slowth.storekit needs to be a real file
# reference in the project for Xcode's scheme editor to resolve the
# StoreKit Configuration picker (a filesystem path alone in the scheme isn't
# enough — it shows up red/unresolved otherwise).
fileGroups:
  - Configs/Slowth.storekit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.9.3"
    CURRENT_PROJECT_VERSION: 9
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Unscroll:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: App
        excludes:
          - "Info.plist"
          - "Unscroll.entitlements"
      - path: Shared
        excludes:
          - "ContentView_iOS.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        PRODUCT_NAME: Slowth
        CURRENT_PROJECT_VERSION: 9
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Unscroll.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: UnscrollExtension
        embed: true

  UnscrollExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: Extension
        excludes:
          - "Info.plist"
          - "UnscrollExtension.entitlements"
      - path: Shared
        excludes:
          - "UnscrollApp.swift"
          - "ContentView_iOS.swift"
          - "ContentView_macOS.swift"
          - "RealtimeBlockingBetaSheet.swift"
          - "AppState.swift"
          - "TipStore.swift"
      - path: WebExt/manifest.json
        buildPhase: resources
      - path: WebExt/config.js
        buildPhase: resources
      - path: WebExt/rules-loader.js
        buildPhase: resources
      - path: WebExt/background.js
        buildPhase: resources
      - path: WebExt/app.html
        buildPhase: resources
      - path: WebExt/app.css
        buildPhase: resources
      - path: WebExt/i18n.js
        buildPhase: resources
      - path: WebExt/app.js
        buildPhase: resources
      - path: WebExt/blocked.html
        buildPhase: resources
      - path: WebExt/blocked.css
        buildPhase: resources
      - path: WebExt/blocked.js
        buildPhase: resources
      - path: WebExt/_locales
        type: folder
        buildPhase: resources
      - path: WebExt/content
        type: folder
        buildPhase: resources
      - path: WebExt/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.Extension
        PRODUCT_NAME: UnscrollExtension
        CURRENT_PROJECT_VERSION: 9
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/UnscrollExtension.entitlements
        SKIP_INSTALL: YES

  UnscrollIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: iOS
        excludes:
          - "Info.plist"
          - "Info-Release.plist"
          - "Unscroll.entitlements"
      - path: Shared
        # iOS compiles both ContentView_iOS.swift and ContentView_macOS.swift —
        # the iOS UI is default, macOS-style is a "Compact" alternative selected
        # at runtime via @AppStorage("uiMode").
      # Frozen experimental V15 / V6: quality failed; V15 validation CoreML parity failed.
      - path: data-model/exports/v15-cascade-v6-20260920-124303/v15/SurfaceDetectorV15.mlpackage
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v15-cascade-v6-20260920-124303/v15/SurfaceDetectorV15Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/AppRouterV6.mlpackage
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/YouTubeDetectorV6.mlpackage
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/InstagramDetectorV6.mlpackage
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/CascadeV6Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v14-cascade-v5-20260920-1018/v14/SurfaceDetectorV14.mlpackage
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v14-cascade-v5-20260920-1018/v14/SurfaceDetectorV14Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
        buildPhase: resources
    settings:
      configs:
        Release:
          INFOPLIST_FILE: iOS/Info-Release.plist
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) *.mlpackage *Metadata.json"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        PRODUCT_NAME: Unscroll
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Unscroll.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # There's already a real native macOS app (the `Unscroll` target, using
        # MacContentView) — don't also let this iOS binary run on Apple Silicon
        # Macs via "Designed for iPad" compatibility. That mode just drops the
        # iPhone-shaped ContentView into an arbitrary freeform desktop window
        # (sheets float mid-window, the hero-card scroller gets clipped, etc.)
        # since it isn't designed for that. Mac users should get the real app.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CASCADE_MODEL"
    dependencies:
      - target: UnscrollExtensionIOS
        embed: true
      - target: UnscrollBroadcastIOS
        embed: true
      - target: UnscrollShieldConfigIOS
        embed: true
      - target: UnscrollShieldActionIOS
        embed: true
      - target: UnscrollDeviceActivityIOS
        embed: true

  UnscrollBroadcastIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: RealtimeShield
        excludes:
          - "Info.plist"
          - "UnscrollBroadcast.entitlements"
          - "SurfaceDetector.mlpackage"
          - "SurfaceDetectorMetadata.json"
      # Release uses Cascade V6 only; Debug also bundles V14/V15 and full calibration metadata.
      # Frozen experimental V15 / V6: quality failed; V15 validation CoreML parity failed.
      - path: data-model/exports/v15-cascade-v6-20260920-124303/v15/SurfaceDetectorV15.mlpackage
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v15-cascade-v6-20260920-124303/v15/SurfaceDetectorV15Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/AppRouterV6.mlpackage
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/YouTubeDetectorV6.mlpackage
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/InstagramDetectorV6.mlpackage
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/CascadeV6Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v14-cascade-v5-20260920-1018/v14/SurfaceDetectorV14.mlpackage
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v14-cascade-v5-20260920-1018/v14/SurfaceDetectorV14Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
        buildPhase: resources
      - path: iOS/ManagedSettingsApplier.swift
        buildPhase: sources
      - path: Shared
        excludes:
          - "UnscrollApp.swift"
          - "ContentView_iOS.swift"
          - "ContentView_macOS.swift"
          - "RealtimeBlockingBetaSheet.swift"
          - "AppState.swift"
          - "TipStore.swift"
    settings:
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) CascadeV6RuntimeMetadata.json"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) SurfaceDetectorV14.mlpackage SurfaceDetectorV14Metadata.json SurfaceDetectorV15.mlpackage SurfaceDetectorV15Metadata.json CascadeV6Metadata.json"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.Broadcast
        PRODUCT_NAME: UnscrollBroadcastIOS
        INFOPLIST_FILE: RealtimeShield/Info.plist
        CODE_SIGN_ENTITLEMENTS: RealtimeShield/UnscrollBroadcast.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CASCADE_MODEL"

  UnscrollDeviceActivityIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: DeviceActivityIOS
        excludes:
          - "Info.plist"
          - "UnscrollDeviceActivity.entitlements"
      - path: iOS/ManagedSettingsApplier.swift
        buildPhase: sources
      - path: Shared/AppGroup.swift
        buildPhase: sources
      - path: Shared/FeatureFlags.swift
        buildPhase: sources
      - path: Shared/RealtimeShieldLog.swift
        buildPhase: sources
      - path: Shared/SharedStore.swift
        buildPhase: sources
      - path: Shared/AppLocalization.swift
        buildPhase: sources
      - path: Shared/SoftYouTubeActivityMonitoring.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.DeviceActivity
        PRODUCT_NAME: UnscrollDeviceActivityIOS
        INFOPLIST_FILE: DeviceActivityIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityIOS/UnscrollDeviceActivity.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  UnscrollShieldConfigIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: ShieldConfigIOS
        excludes:
          - "Info.plist"
          - "UnscrollShieldConfig.entitlements"
      - path: Shared
        excludes:
          - "UnscrollApp.swift"
          - "ContentView_iOS.swift"
          - "ContentView_macOS.swift"
          - "RealtimeBlockingBetaSheet.swift"
          - "AppState.swift"
          - "TipStore.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.ShieldConfig
        PRODUCT_NAME: UnscrollShieldConfigIOS
        INFOPLIST_FILE: ShieldConfigIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfigIOS/UnscrollShieldConfig.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  UnscrollShieldActionIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: ShieldActionIOS
        excludes:
          - "Info.plist"
          - "UnscrollShieldAction.entitlements"
      - path: iOS/ManagedSettingsApplier.swift
        buildPhase: sources
      - path: Shared
        excludes:
          - "UnscrollApp.swift"
          - "ContentView_iOS.swift"
          - "ContentView_macOS.swift"
          - "RealtimeBlockingBetaSheet.swift"
          - "AppState.swift"
          - "TipStore.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.ShieldAction
        PRODUCT_NAME: UnscrollShieldActionIOS
        INFOPLIST_FILE: ShieldActionIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldActionIOS/UnscrollShieldAction.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  UnscrollExtensionIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: Extension/SafariWebExtensionHandler.swift
        buildPhase: sources
      - path: Shared
        excludes:
          - "UnscrollApp.swift"
          - "ContentView_iOS.swift"
          - "ContentView_macOS.swift"
          - "RealtimeBlockingBetaSheet.swift"
          - "AppState.swift"
          - "TipStore.swift"
      - path: WebExt/manifest.json
        buildPhase: resources
      - path: WebExt/config.js
        buildPhase: resources
      - path: WebExt/rules-loader.js
        buildPhase: resources
      - path: WebExt/background.js
        buildPhase: resources
      - path: WebExt/app.html
        buildPhase: resources
      - path: WebExt/app.css
        buildPhase: resources
      - path: WebExt/i18n.js
        buildPhase: resources
      - path: WebExt/app.js
        buildPhase: resources
      - path: WebExt/blocked.html
        buildPhase: resources
      - path: WebExt/blocked.css
        buildPhase: resources
      - path: WebExt/blocked.js
        buildPhase: resources
      - path: WebExt/_locales
        type: folder
        buildPhase: resources
      - path: WebExt/content
        type: folder
        buildPhase: resources
      - path: WebExt/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.Extension
        PRODUCT_NAME: UnscrollExtension
        INFOPLIST_FILE: ExtensionIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExtensionIOS/UnscrollExtension.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Unscroll:
    build:
      targets:
        Unscroll: all
    run:
      config: Debug
      storeKitConfiguration: Configs/Slowth.storekit
  Unscroll (iOS):
    build:
      targets:
        UnscrollIOS: all
    run:
      config: Debug
      storeKitConfiguration: Configs/Slowth.storekit
