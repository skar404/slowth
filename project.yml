name: Unscroll
options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  # Paths inside .xcscheme files (e.g. storeKitConfiguration) resolve relative to
  # xcshareddata/xcschemes/, which is 3 levels below the repo root, not 2 —
  # XcodeGen's own default ("../../") is one level short and left StoreKit
  # Configuration showing as an unresolved (red) reference in Xcode.
  schemePathPrefix: "../../../"

configFiles:
  Debug: Configs/Local.xcconfig
  Release: Configs/Local.xcconfig

# Loose files that should be visible in the project navigator but aren't part
# of any target's build phases. Slowth.storekit needs to be a real file
# reference in the project for Xcode's scheme editor to resolve the
# StoreKit Configuration picker (a filesystem path alone in the scheme isn't
# enough — it shows up red/unresolved otherwise).
fileGroups:
  - Configs/Slowth.storekit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2026.10.6"
    CURRENT_PROJECT_VERSION: 27
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Unscroll:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Debug/UI
      - path: Localization
        buildPhase: resources
      - path: App
        excludes:
          - "Info.plist"
          - "Unscroll.entitlements"
      - path: Debug/Shared
      - path: Shared
        excludes:
          - "ContentView_iOS.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        PRODUCT_NAME: Slowth
        CURRENT_PROJECT_VERSION: 27
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Unscroll.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: UnscrollExtension
        embed: true

  UnscrollExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Localization
        buildPhase: resources
      - path: Extension
        excludes:
          - "Info.plist"
          - "UnscrollExtension.entitlements"
      - path: Debug/Shared
      - path: Shared
        excludes:
          - "UnscrollApp.swift"
          - "AppReviewCoordinator.swift"
          - "AppReviewPrompt.swift"
          - "ContentView_iOS.swift"
          - "ContentView_macOS.swift"
          - "RealtimeBlockingBetaSheet.swift"
          - "HowItWorksSheet.swift"
          - "AppState.swift"
          - "TipStore.swift"
      - path: WebExt/manifest.json
        buildPhase: resources
      - path: WebExt/config.js
        buildPhase: resources
      - path: WebExt/rules-loader.js
        buildPhase: resources
      - path: WebExt/background.js
        buildPhase: resources
      - path: WebExt/app.html
        buildPhase: resources
      - path: WebExt/app.css
        buildPhase: resources
      - path: WebExt/i18n.js
        buildPhase: resources
      - path: WebExt/app.js
        buildPhase: resources
      - path: WebExt/blocked.html
        buildPhase: resources
      - path: WebExt/blocked.css
        buildPhase: resources
      - path: WebExt/blocked.js
        buildPhase: resources
      - path: WebExt/_locales
        type: folder
        buildPhase: resources
      - path: WebExt/content
        type: folder
        buildPhase: resources
      - path: WebExt/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.Extension
        PRODUCT_NAME: UnscrollExtension
        CURRENT_PROJECT_VERSION: 27
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/UnscrollExtension.entitlements
        SKIP_INSTALL: YES

  UnscrollIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Debug/UI
      - path: Debug/iOS
      - path: Localization
        buildPhase: resources
      - path: iOS
        excludes:
          - "WebPause"
          - "Info.plist"
          - "Info-Release.plist"
          - "Unscroll.entitlements"
      - path: Debug/Shared
      - path: Shared
        # iOS compiles both ContentView_iOS.swift and ContentView_macOS.swift —
        # the iOS UI is default, macOS-style is a "Compact" alternative selected
        # at runtime via @AppStorage("uiMode").
      # Flat 14 is the default; Flat 11/12/13 and V10 remain alternatives.
      - path: RealtimeShield/FlatDetectorMetadata.json
      - path: RealtimeShield/FlatDetector12Metadata.json
      - path: RealtimeShield/FlatDetector13Metadata.json
      - path: RealtimeShield/FlatDetector14Metadata.json
      - path: data-model/exports/flat-11-seed7-20261015/FlatDetector.mlpackage
        optional: true
      - path: data-model/exports/flat-14-seed7-20261028/ios-resources/FlatDetector14.mlpackage
        optional: true # Required in Release model assets.
      - path: data-model/exports/flat-13-seed7-20261027/ios-resources/FlatDetector13.mlpackage
        optional: true # Required in Release model assets.
      - path: data-model/exports/flat-12-seed7-20261027/ios-resources/FlatDetector12.mlpackage
        optional: true # Required in Release model assets.
      - path: data-model/exports/flat-11-seed7-iphone13promax-20261026/ios-resources/FlatDetectorIPhone13ProMax.mlpackage
        optional: true # Local Debug candidate only.
      - path: data-model/exports/flat-11-seed7-iphone13promax-20261026/ios-resources/FlatDetectorIPhone13ProMaxMetadata.json
        optional: true
      - path: data-model/exports/cascade-v10-study-20260929-1356/diverse/ios-resources/AppRouterV10.mlpackage
        optional: true # Debug rollback model.
      - path: data-model/exports/cascade-v10-study-20260929-1356/diverse/ios-resources/YouTubeDetectorV10.mlpackage
        optional: true # Debug rollback model.
      - path: data-model/exports/cascade-v10-study-20260929-1356/diverse/ios-resources/InstagramDetectorV10.mlpackage
        optional: true # Debug rollback model.
      - path: data-model/exports/cascade-v10-study-20260929-1356/diverse/ios-resources/FacebookDetectorV10.mlpackage
        optional: true # Debug rollback model.
      - path: data-model/exports/cascade-v10-study-20260929-1356/diverse/ios-resources/XDetectorV10.mlpackage
        optional: true # Debug rollback model.
      - path: data-model/exports/cascade-v10-study-20260929-1356/diverse/ios-resources/CascadeV10Metadata.json
        optional: true # Full training metadata is only used in Debug.
      # Retain V8 for explicit Debug comparisons.
      - path: data-model/exports/cascade-v8-x-20260928/ios-resources/AppRouterV8.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v8-x-20260928/ios-resources/YouTubeDetectorV8.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v8-x-20260928/ios-resources/InstagramDetectorV8.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v8-x-20260928/ios-resources/FacebookDetectorV8.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v8-x-20260928/ios-resources/XDetectorV8.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v8-x-20260928/ios-resources/CascadeV8Metadata.json
        optional: true # Full training metadata is only used in Debug.
      # Retain V7 for explicit Debug comparisons.
      - path: data-model/exports/cascade-v7-facebook-20260928-114500/ios-resources/AppRouterV7.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v7-facebook-20260928-114500/ios-resources/YouTubeDetectorV7.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v7-facebook-20260928-114500/ios-resources/InstagramDetectorV7.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v7-facebook-20260928-114500/ios-resources/FacebookDetectorV7.mlpackage
        optional: true # Legacy Debug model.
      - path: data-model/exports/cascade-v7-facebook-20260928-114500/ios-resources/CascadeV7Metadata.json
        optional: true # Private experimental exports can be absent.
      # Frozen experimental V15 / V6: quality failed; V15 validation CoreML parity failed.
      - path: data-model/exports/v15-cascade-v6-20260920-124303/v15/SurfaceDetectorV15.mlpackage
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v15-cascade-v6-20260920-124303/v15/SurfaceDetectorV15Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/AppRouterV6.mlpackage
        optional: true # Legacy Debug candidate; not required for Release.
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/YouTubeDetectorV6.mlpackage
        optional: true # Legacy Debug candidate; not required for Release.
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/InstagramDetectorV6.mlpackage
        optional: true # Legacy Debug candidate; not required for Release.
      - path: data-model/exports/v15-v6-app-20260920-154340/ios-resources/CascadeV6Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v14-cascade-v5-20260920-1018/v14/SurfaceDetectorV14.mlpackage
        optional: true # Debug-only exports are absent in public release checkouts.
      - path: data-model/exports/v14-cascade-v5-20260920-1018/v14/SurfaceDetectorV14Metadata.json
        optional: true # Debug-only exports are absent in public release checkouts.
        buildPhase: resources
    settings:
      configs:
        Release:
          INFOPLIST_FILE: iOS/Info-Release.plist
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) *.mlpackage *Metadata.json"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        PRODUCT_NAME: Unscroll
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Unscroll.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # There's already a real native macOS app (the `Unscroll` target, using
        # MacContentView) — don't also let this iOS binary run on Apple Silicon
        # Macs via "Designed for iPad" compatibility. That mode just drops the
        # iPhone-shaped ContentView into an arbitrary freeform desktop window
        # (sheets float mid-window, the hero-card scroller gets clipped, etc.)
        # since it isn't designed for that. Mac users should get the real app.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CASCADE_MODEL"
    dependencies:
